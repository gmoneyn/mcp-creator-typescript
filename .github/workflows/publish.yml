# Publishes mcp-creator-typescript to npm through Trusted Publishing (OIDC).
# No registry token exists in this repo or its secrets: npm accepts the short-lived
# identity GitHub mints for this workflow file + the `npm` environment.
# Trigger: publishing a GitHub release.
#
# Two jobs, on purpose. `build` installs dependencies and runs their scripts, the
# tests and the build, and holds no publishing identity. `publish` holds the identity
# and installs nothing: it downloads the tarball `build` produced and publishes that
# exact file. A compromised dependency therefore never runs next to id-token: write.
#
# Actions are pinned to full commit SHAs; the trailing comment is the release that
# SHA is tagged as.
name: publish
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main   # tag must be on main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', package-manager-cache: false }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: mkdir pack && npm pack --pack-destination pack
      - run: sha256sum pack/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: npm-tarball, path: pack/, if-no-files-found: error }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions: { id-token: write }    # ONLY this job gets it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: npm-tarball, path: pack/ }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org', package-manager-cache: false }
      # npm's documented floor for OIDC is 11.5.1. Checked with node alone: nothing is
      # fetched from the registry in the job that holds the publishing identity.
      - run: |
          node -e '
            const v = process.argv[1];
            const [a, b, c] = v.split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error("npm " + v + " is below 11.5.1, the floor for trusted publishing"); process.exit(1); }
            console.log("npm " + v + " ok");
          ' "$(npm -v)"
      # No checkout, no npm ci, no build: publish the file the build job made.
      - run: |
          set -euo pipefail
          files=(pack/*.tgz)
          [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ] || { echo "expected exactly one tarball in pack/, found: ${files[*]}"; exit 1; }
          sha256sum "${files[0]}"
          npm stage publish "./${files[0]}" --provenance --access public --ignore-scripts
